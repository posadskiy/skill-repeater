name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.posadskiy.com/skill-repeater
      VITE_AUTH_URL: https://api.posadskiy.com/auth
      VITE_USER_URL: https://api.posadskiy.com/user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

#tag::micronaut[]
micronaut:
  application:
    name: skill-repeater-service
  server:
    port: 8210
    cors:
      enabled: false
  lifecycle:
    graceful-shutdown:
      enabled: true
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            validation:
              secret: "${JWT_GENERATOR_SIGNATURE_SECRET}"
        claims-validators:
          issuer: ${AUTH_JWT_ISSUER:`https://auth.posadskiy.com`}
          audience: ${AUTH_JWT_AUDIENCE:api.posadskiy.com}
          not-before: true
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
  tracing:
    opentelemetry:
      enabled: true
#end::micronaut[]

#tag::prometheus[]
# /prometheus stays unauthenticated for in-cluster scrapes. The public ingress does not route it.
endpoints:
  health:
    enabled: true
    sensitive: false
  liveness:
    enabled: true
    sensitive: false
  readiness:
    enabled: true
    sensitive: false
  prometheus:
    enabled: true
    sensitive: false
#end::prometheus[]

email:
  service:
    url: ${EMAIL_SERVICE_URL:`http://email-template-service.local/email/template/send`}

app:
  public-url: ${APP_PUBLIC_URL:`https://repeaty.posadskiy.com`}

reminders:
  enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      protocol: grpc
  traces:
    exporter: otlp
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:1.0}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io.micronaut.data.query: INFO

auth:
  service:
    url: ${AUTH_SERVICE_URL:`http://auth-service.local`}
  client:
    id: ${AUTH_SERVICE_CLIENT_ID:system}
    secret: ${AUTH_SERVICE_CLIENT_SECRET}

#tag::database[]
datasources:
  default:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    schema-generate: NONE
    dialect: POSTGRES
    maximum-pool-size: 2
    minimum-idle: 0
    connection-timeout: 3000
    leak-detection-threshold: 60000
flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: true
#end::database[]
